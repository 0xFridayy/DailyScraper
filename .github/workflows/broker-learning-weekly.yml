name: Broker Learning Weekly
# Vendor source bytes and derived private data belong in SPECTRA-evidence.
# Existing historical public Git objects are not rewritten by this retirement.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrated:
    runs-on: ubuntu-latest
    steps:
      - name: Point to the private source pipeline without accessing a provider
        run: |
          echo "::error::This public data writer is retired. Use 0xFridayy/SPECTRA-evidence broker-subset-private.yml."
          exit 1
