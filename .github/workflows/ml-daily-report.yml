name: NeoBDM Daily ML Report

# Runs the XGBoost walk-forward backtest and DDQN entry/exit agent against
# the current neobdm.db and reports the headline numbers - a short Telegram
# message (check from your phone) and a fuller table in this run's job
# summary (check from a browser, no login needed). Read-only: never touches
# neobdm.db, so there's no git push step and no race risk with
# daily-scrape.yml / price-history-topup.yml.
#
# Runs by request every evening (20:00 Asia/Jakarta, UTC+7, no DST) - well
# after both the morning scrape (23:00 UTC prev day = 06:00 WIB) and the
# price_history top-up (00:30 UTC = 07:30 WIB), so it always sees that
# day's fresh data. Results move little day-to-day at this data size (see
# walk_forward_backtest.py / ddqn_entry_exit.py docstrings for back-to-back
# reruns that changed little), so don't read a daily wiggle as a trend -
# it's here for visibility, not because daily reruns are expected to find
# something new most days.

on:
  schedule:
    - cron: "0 13 * * *"  # 20:00 Asia/Jakarta (UTC+7) daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run XGBoost + DDQN report
        run: python run_ml_reports.py
