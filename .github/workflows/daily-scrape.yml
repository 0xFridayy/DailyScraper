name: NeoBDM Daily Scrape

on:
  schedule:
    # 23:00 UTC == 07:00 Asia/Kuala_Lumpur (UTC+8, no DST).
    # Note: GitHub may delay scheduled runs by a few minutes under load.
    - cron: "0 23 * * *"
  workflow_dispatch:  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Never let a manual run overlap the scheduled one: both push neobdm.db.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEOBDM_USERNAME: ${{ secrets.NEOBDM_USERNAME }}
      NEOBDM_PASSWORD: ${{ secrets.NEOBDM_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (+ system deps)
        run: python -m playwright install --with-deps chromium

      # morning.py runs the unchanged scrape (neobdm_scraper.run_all_jobs),
      # then sends ONE message with picks + follow-ups instead of the raw list.
      # To roll back, change this line back to: python neobdm_scraper.py --now
      - name: Run scraper + morning picks (one-shot)
        run: python morning.py

      # market_summary/dashboard scrapes have been silently failing
      # (selector timeouts, likely a NeoBDM site update) without failing the
      # job overall - upload the page snapshots neobdm_scraper.py saves so
      # they can actually be inspected afterward instead of just a log line.
      # if: always() so this still runs even if the scraper step errors out.
      - name: Upload page snapshots for debugging
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: page-snapshots-${{ github.run_id }}
          path: |
            *.png
            *.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated neobdm.db, raw fragments and daily picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only these two paths -- never `git add .` / `git add -A`.
          # market_summary_raw_fragments/ holds the immutable screener responses the
          # capture manifest (ms_capture_manifest) points at: content-addressed and
          # write-once (neobdm_source_contract.store_raw_bytes), so an unchanged
          # response re-adds nothing and no step here can stage a deletion. The
          # guard keeps a run that stored no response from failing under `set -e`.
          git add neobdm.db
          if [ -d market_summary_raw_fragments ]; then
            git add market_summary_raw_fragments/
          fi
          # daily_picks.db: picks, learned weights and sent-message log (morning.py).
          if [ -f daily_picks.db ]; then
            git add daily_picks.db
          fi
          git diff --staged --quiet || git commit -m "Update neobdm.db ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::push failed 3 times - today's data is NOT saved"
          exit 1
